name: Harvest station catalogs

# The Archive (#188). Phase 0: every station-capable source is asked for its
# catalog (GeoParquet + GeoJSON + health.json). Phase 1: a budget of stations
# per source gets its daily series harvested into obs/<variable>/<source>/,
# incrementally (the previous obs/ tree is synced first). Everything is then
# published to the public Hugging Face dataset. Per-source failures are
# recorded and shown in the job summary; the run only fails when every
# catalog source failed.

on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the Hugging Face dataset"
        type: boolean
        default: true
      max_items:
        description: "Cap per source (leave empty for the full catalog)"
        type: string
        default: ""
      obs_budget:
        description: "Stations per source to harvest daily series for (default 150)"
        type: string
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET: Rekin226/aquascope-gauges
      # Optional: a free USGS API key lifts the shared demo-key throttling on
      # the national catalog walk (https://api.waterdata.usgs.gov/signup/).
      USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install aquascope with the archive extra
        run: python -m pip install -q ".[archive]"

      - name: Sync the existing observations (incremental runs)
        if: env.HF_TOKEN != ''
        run: python -c "from aquascope.archive.observations import sync_from_hub; sync_from_hub('archive', '$HF_DATASET')"

      - name: Harvest station catalogs
        id: harvest
        run: |
          set +e
          ARGS="--out archive"
          if [ -n "${{ inputs.max_items }}" ]; then ARGS="$ARGS --max-items ${{ inputs.max_items }}"; fi
          aquascope harvest stations $ARGS
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Harvest daily observations (budgeted; the archive fills up over weeks)
        id: obs
        timeout-minutes: 120
        run: |
          set +e
          aquascope harvest obs --out archive --source usgs --source uk_ea --source hubeau_hydrometrie \
            --max-stations ${{ inputs.obs_budget || 150 }}
          aquascope harvest obs --out archive --source taiwan_cwa --max-stations 15
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Publish to the Hugging Face dataset
        if: env.HF_TOKEN != '' && (github.event_name == 'schedule' || inputs.publish == 'true' || inputs.publish == '')
        run: |
          python - <<'EOF'
          import os
          from aquascope.archive import publish_folder
          print(publish_folder("archive", os.environ["HF_DATASET"], commit_message=f"harvest {os.environ.get('GITHUB_RUN_ID','')}"))
          EOF

      - name: Job summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("archive/health.json")
          if not p.exists():
              print("## Harvest\n\nno health.json written (harvest crashed before writing)")
              raise SystemExit
          h = json.loads(p.read_text())
          print(f"## Harvest {h['run_at']}\n")
          print(f"**{h['n_stations']:,} stations**, {h['n_ok']}/{len(h['sources'])} sources OK\n")
          print("| source | status | stations | seconds |\n| --- | --- | ---: | ---: |")
          for s in h["sources"]:
              status = "ok" if s["ok"] else f"FAILED: `{s['error']}`"
              print(f"| `{s['source']}` | {status} | {s['n_stations']:,} | {s['seconds']} |")
          EOF

      - name: Open / update / close collector-health issues from health.json
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/harvest_issues.py archive/health.json --repo "$GITHUB_REPOSITORY" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Upload the harvest as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harvest-${{ github.run_id }}
          path: archive/
          retention-days: 30

      - name: Fail only if every source failed
        run: |
          if [ "${{ steps.harvest.outputs.exit }}" != "0" ]; then
            echo "harvest exited ${{ steps.harvest.outputs.exit }} (all sources failed or publish failed)"; exit 1
          fi
